<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="PointerL 的个人主页，访问博客、文章归档和 GitHub 项目。">
  <meta name="theme-color" content="#14232c">
  <title>PointerL · 个人主页</title>
  <style>
    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      display: grid;
      grid-template-rows: 1fr auto;
      color: #fff;
      background: radial-gradient(ellipse at 35% 15%, #3c5861, #14232c 68%);
      font: 1rem/1.65 Inter, "Microsoft YaHei", system-ui, sans-serif;
    }

    .backdrop {
      position: fixed;
      inset: 0;
      z-index: -1;
      background-position: center;
      background-size: cover;
    }

    .panel-cover {
      display: grid;
      place-items: center;
      padding: 4rem 1.25rem 2rem;
      text-align: center;
      text-shadow: 0 2px 12px #0009;
    }

    .panel-main__content { width: min(100%, 38rem); }

    .avatar {
      display: block;
      width: 6rem;
      height: 6rem;
      margin: 0 auto 1.25rem;
      border: 2px solid #ffffffb3;
      border-radius: 50%;
      object-fit: cover;
      background: #1b2f3b;
      box-shadow: 0 4px 20px #0005;
    }

    .panel-title {
      margin: 0;
      font: 400 clamp(3rem, 9vw, 5rem)/1.05 "Instrument Serif", Georgia, serif;
      letter-spacing: -.04em;
    }

    .panel-subtitle { margin: .65rem 0 0; letter-spacing: .25em; }

    .panel-cover__divider {
      width: min(12rem, 50%);
      margin: 1.8rem auto;
      border: 0;
      border-top: 1px solid #ffffff6b;
    }

    figure { margin: 0; }
    blockquote { margin: 0; font-size: clamp(1.05rem, 3.5vw, 1.25rem); }
    figcaption { margin-top: .45rem; font-size: .86rem; color: #f0f4f6; }

    .navigation {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: .65rem;
      padding: 0;
      margin: 1.9rem 0 0;
      list-style: none;
    }

    a { color: inherit; }
    a:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }

    .navigation a {
      display: block;
      min-width: 5rem;
      padding: .58rem 1rem;
      border: 1px solid #ffffffbc;
      border-radius: 2rem;
      background: #0a18294d;
      color: #fff;
      font-size: .92rem;
      text-decoration: none;
    }

    .navigation a:hover { background: #fff; color: #14232c; text-shadow: none; }
    footer { padding: 1rem; text-align: center; color: #f0f4f6; font-size: .8rem; }
    footer a { text-underline-offset: .2em; }
  </style>
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>
  <main class="panel-cover">
    <div class="panel-main__content">
      <img class="avatar" src="https://avatars.githubusercontent.com/u/124577547?v=4&amp;s=192" width="96" height="96" alt="PointerL 的 GitHub 头像">
      <h1 class="panel-title">PointerL</h1>
      <p class="panel-subtitle">个人主页</p>
      <hr class="panel-cover__divider">
      <figure>
        <blockquote id="quote">行到水穷处，坐看云起时。</blockquote>
        <figcaption id="quote-source">王维《终南别业》</figcaption>
      </figure>
      <nav aria-label="站点导航">
        <ul class="navigation">
          <li><a href="./blog/">博客</a></li>
          <li><a href="./archives/">归档</a></li>
          <li><a href="https://github.com/PointerL">GitHub</a></li>
        </ul>
      </nav>
    </div>
  </main>
  <footer>主题基于 <a href="https://github.com/dmego/home.github.io">Dmego Home</a></footer>
  <script>
    const quotes = [
      ["行到水穷处，坐看云起时。", "王维《终南别业》"],
      ["长风破浪会有时，直挂云帆济沧海。", "李白《行路难·其一》"],
      ["海内存知己，天涯若比邻。", "王勃《送杜少府之任蜀州》"],
      ["千里之行，始于足下。", "《道德经》"],
      ["纸上得来终觉浅，绝知此事要躬行。", "陆游《冬夜读书示子聿》"]
    ];

    const wallpapers = [
      "https://cn.bing.com/th?id=OHR.AbrahamCanada_EN-US3455540217_1920x1080.jpg",
      "https://www.bing.com/th?id=OHR.NorthWindow_EN-US1170338293_1920x1080.jpg",
      "https://www.bing.com/th?id=OHR.PipiwaiTrail_EN-US0631882545_1920x1080.jpg"
    ];

    const pick = (items) => items[Math.floor(Math.random() * items.length)];
    const [quote, source] = pick(quotes);
    document.getElementById("quote").textContent = quote;
    document.getElementById("quote-source").textContent = source;

    const wallpaper = new Image();
    wallpaper.onload = () => {
      document.querySelector(".backdrop").style.backgroundImage =
        `linear-gradient(#09141c80, #09141cb8), url("${wallpaper.src}")`;
    };
    wallpaper.src = pick(wallpapers);
  </script>
</body>
</html>
